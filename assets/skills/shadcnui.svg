      <stop offset="0%" stop-color="#ff3e00" />
      <stop offset="100%" stop-color="#ff7300" />
    </linearGradient>
    <linearGradient id="grayGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4b5563" />
      <stop offset="100%" stop-color="#6b7280" />
    </linearGradient>
    <filter id="grayscale">
      <feColorMatrix type="matrix" values="0.33 0.33 0.33 0 0
                                           0.33 0.33 0.33 0 0
                                           0.33 0.33 0.33 0 0
                                           0    0    0    1 0"/>
    </filter>
  </defs>
  <!-- Background Card -->
  <rect width="300" height="40" rx="8" fill="#0d0d0f" stroke="#ff4a00" stroke-width="1.5"/>
  
  <!-- Background Circle for Icon -->
  <circle cx="22" cy="20" r="12" fill="#1a1a1e"/>
  <svg x="12" y="10" width="20" height="20" viewBox="0 0 256 256"><path fill="none" d="M0 0h256v256H0z"/><path fill="none" stroke="#fff" stroke-width="25" stroke-linecap="round" d="M208 128l-80 80M192 40L40 192"/></svg>
  
  <!-- Tech Name -->
  <text x="42" y="24" fill="#ffffff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold">Shadcn/ui</text>
  
  <!-- Progress Bar Track -->
